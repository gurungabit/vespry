name: Release

# Cut a release by pushing a version tag (scripts/release.sh does the
# bookkeeping), or run it manually from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # ggml (whisper.cpp/llama.cpp) needs std::filesystem; older default
  # deployment targets make clang reject it.
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  release:
    name: Build & publish (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deep ad-hoc signature over the whole bundle. Without it the
          # nested frameworks' seals don't validate and Gatekeeper reports
          # the download as "damaged" rather than merely unidentified.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vespry ${{ github.ref_name }}"
          releaseBody: |
            On-device dictation for macOS 14+ (Apple Silicon).

            ### Install

            1. Download the `.dmg` and drag **Vespry** to Applications.
            2. Run this once, then open Vespry:

                ```
                xattr -dr com.apple.quarantine /Applications/Vespry.app
                ```

            Step 2 is required: the app is signed but not notarized (that needs a paid Apple Developer account), so macOS quarantines the download and reports it as **"damaged"** until the flag is cleared. It isn't damaged — right-click → Open does *not* work around this for unnotarized builds on Apple Silicon; the `xattr` command does.

            Models (~3 GB total) download on first run. Grant Microphone and Accessibility when prompted.

            Check what you're running in **Settings → About** — it shows the version and the exact commit.
          releaseDraft: false
          prerelease: false
