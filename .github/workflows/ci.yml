name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & test (macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build frontend
        run: pnpm build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      # ASR/LLM e2e tests self-skip on CI (no models downloaded); the
      # prompt/guardrail unit tests still run, and this compiles everything.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib
