[package]
name = "vespry"
version = "0.1.3"
description = "Local, private dictation for your Mac — hold a key, speak, done."
authors = ["abit"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the bin target on Windows.
name = "vespry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.11", default-features = false, features = ["onnx", "whisper-metal"] }
cpal = "0.16"
rubato = "0.16"
enigo = "0.6"
arboard = "3.6.1"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "fs", "io-util"] }
futures-util = "0.3.34"
rdev = { git = "https://github.com/rustdesk-org/rdev", version = "0.5.0-2" }
reqwest = { version = "0.13.4", features = ["stream"] }
llama-cpp-2 = "0.1.154"
tauri-plugin-autostart = "2.5.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
tauri-plugin-macos-permissions = "2.3.0"
