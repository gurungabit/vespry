[package]
name = "vespry"
version = "0.1.0"
description = "Local, private dictation for your Mac — hold a key, speak, done."
authors = ["abit"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a name collision with the bin target on Windows.
name = "vespry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
